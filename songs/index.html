<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RAYとメンバーによる楽曲の初披露日、クレジット、アレンジ情報をたどれるアーカイブ" />
    <title>楽曲情報 — RAY Archives</title>
    <link rel="stylesheet" href="../site.css?v=20261103-songs" />
  </head>
  <body class="songs-page">
    <a class="skip-link" href="#song-results">楽曲一覧へ移動</a>
    <header class="site-header">
      <a class="wordmark" href="../" aria-label="RAY Archives トップ">RAY <span>ARCHIVES</span></a>
      <nav aria-label="主なページ"><a href="../">TOP</a><a href="../events/">EVENTS</a><a href="./" aria-current="page">SONGS</a></nav>
    </header>
    <main>
      <section class="page-hero page-hero--songs" aria-labelledby="page-title">
        <div><p class="eyebrow">02 / SONGS</p><h1 id="page-title">楽曲情報</h1></div>
        <div class="hero-copy"><p>RAYとメンバーの楽曲を、初披露日とクレジットからたどれます。オリジナル、カバー、アレンジを同じ一覧で確認できます。</p><dl class="event-summary song-summary"><div><dt>SONGS</dt><dd id="song-total">—</dd></div><div><dt>ARTISTS</dt><dd id="artist-total">—</dd></div><div><dt>FORMS</dt><dd id="form-total">—</dd></div></dl></div>
      </section>
      <section class="song-controls" aria-labelledby="song-filter-heading">
        <div class="song-controls-copy"><p class="eyebrow">FILTER</p><h2 id="song-filter-heading">楽曲を絞り込む</h2><p id="song-filter-status">すべての楽曲を表示</p></div>
        <div class="song-filter-fields">
          <label class="song-search"><span>キーワード</span><input id="song-search" type="search" placeholder="楽曲名・クレジットで検索" autocomplete="off" /></label>
          <label class="song-select"><span>アーティスト</span><select id="artist-filter"><option value="">すべて</option></select></label>
          <label class="song-select"><span>種別</span><select id="type-filter"><option value="">すべて</option></select></label>
        </div>
      </section>
      <section id="song-results" class="song-results" aria-live="polite">
        <header class="results-header"><p class="eyebrow">SONG ARCHIVE</p><h2 id="song-results-title">読み込み中…</h2><p id="song-results-description"></p></header>
        <div id="song-list"></div>
        <p id="song-empty" class="empty-state" hidden>一致する楽曲はありません。検索語または条件を変更してください。</p>
      </section>
    </main>
    <footer><p>RAY ARCHIVES</p><a href="../">TOPへ戻る ↑</a><a href="../events/">イベント出演情報</a><a href="https://github.com/Hamaboh/RAY_Archives" target="_blank" rel="noreferrer">GITHUB ↗</a></footer>
    <script type="module" src="songs.js?v=20261103-songs"></script>
  </body>
</html>
