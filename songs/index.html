  <body class="songs-page">
    <a class="skip-link" href="#song-results">楽曲一覧へ移動</a>
    <header class="site-header">
      <a class="wordmark" href="../" aria-label="RAY Archives トップ">RAY <span>ARCHIVES</span></a>
      <nav aria-label="主なページ"><a href="../">TOP</a><a href="../events/">EVENTS</a><a href="./" aria-current="page">ORIGINAL</a><a href="../limited-songs/">LIMITED</a><a href="../statistics/">STATS</a></nav>
    </header>
    <main>
      <section class="page-hero page-hero--songs" aria-labelledby="page-title">
        <div><p class="eyebrow">02 / ORIGINAL SONGS</p><h1 id="page-title">オリジナル楽曲</h1></div>
        <div class="hero-copy"><p>RAYとメンバーによるオリジナル楽曲を、アーティスト別に整理。初披露日とクレジットを一緒にたどれます。</p><dl class="event-summary song-summary"><div><dt>SONGS</dt><dd id="song-total">—</dd></div><div><dt>ARTISTS</dt><dd id="artist-total">—</dd></div></dl></div>
      </section>
      <section class="song-controls" aria-labelledby="song-filter-heading">
        <div class="song-controls-copy"><p class="eyebrow">FILTER</p><h2 id="song-filter-heading">楽曲を絞り込む</h2><p id="song-filter-status">すべての楽曲を表示</p></div>
        <div class="song-filter-fields">
          <label class="song-search"><span>キーワード</span><input id="song-search" type="search" placeholder="楽曲名を検索" autocomplete="off" /></label>
          <fieldset class="song-search-scope"><legend>検索対象</legend><div><button type="button" data-search-scope="title" aria-pressed="true">楽曲名</button><button type="button" data-search-scope="credits" aria-pressed="false">クレジット</button></div></fieldset>
          <label class="song-select"><span>アーティスト</span><select id="artist-filter"><option value="">すべて</option></select></label>
          <label class="song-select"><span>活動形態</span><select id="form-filter"><option value="">すべて</option></select></label>
          <label class="song-select"><span>種別</span><select id="type-filter"><option value="">すべて</option></select></label>
        </div>
      </section>
      <section id="song-results" class="song-results" aria-live="polite">
        <header class="results-header"><p class="eyebrow">ORIGINAL SONG ARCHIVE</p><h2 id="song-results-title">読み込み中…</h2><p id="song-results-description"></p></header>
        <div id="song-list"></div>
        <p id="song-empty" class="empty-state" hidden>一致する楽曲はありません。検索語または条件を変更してください。</p>
      </section>
    </main>
