<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RAYのイベント出演記録を年・月・キーワードから閲覧できるアーカイブ" />
    <title>イベント出演情報 — RAY Archives</title>
    <link rel="stylesheet" href="../site.css?v=20261029-performers" />
  </head>
  <body class="events-page">
    <a class="skip-link" href="#event-results">イベント一覧へ移動</a>
    <header class="site-header">
      <a class="wordmark" href="../" aria-label="RAY Archives トップ">RAY <span>ARCHIVES</span></a>
      <nav aria-label="主なページ"><a href="../">TOP</a><a href="./" aria-current="page">EVENTS</a></nav>
      <a class="source-link" href="https://docs.google.com/spreadsheets/d/1HznC7CP34DK1nCNaV4PPCCnaFD4w212HVSUfG0CFywI/edit?gid=512783988" target="_blank" rel="noreferrer">SOURCE ↗</a>
    </header>
    <main>
      <section class="page-hero page-hero--events" aria-labelledby="page-title">
        <div><p class="eyebrow">01 / EVENT APPEARANCES</p><h1 id="page-title">イベント<br />出演情報</h1></div>
        <div class="hero-copy"><p>開催日、公演名、会場からRAYの出演記録をたどれます。年を選ぶと、その年の記録を月ごとにまとめて表示します。</p><dl class="event-summary"><div><dt>RECORDS</dt><dd id="event-total">—</dd></div><div><dt>YEARS</dt><dd id="year-total">—</dd></div></dl></div>
      </section>
      <section class="event-controls" aria-label="イベントを絞り込む"><label class="search-box" for="event-search"><span>SEARCH</span><input id="event-search" type="search" autocomplete="off" placeholder="公演名・会場・出演者を検索" /></label><div class="control-note"><kbd>/</kbd> で検索　<kbd>Esc</kbd> で解除</div></section>
      <section class="event-layout"><aside class="event-years" aria-label="年別のイベント一覧"><p class="eyebrow">YEAR INDEX</p><div id="year-nav" class="year-nav"></div></aside><section id="event-results" class="event-results" aria-live="polite"><header class="results-header"><p id="results-kicker" class="eyebrow">EVENTS</p><h2 id="results-title">読み込み中…</h2><p id="results-description"></p></header><div id="event-list"></div><p id="empty-state" class="empty-state" hidden>一致するイベントはありません。検索語を変更してください。</p></section></section>
    </main>
    <footer><p>RAY ARCHIVES</p><a href="../">TOPへ戻る ↑</a><a href="https://github.com/Hamaboh/RAY_Archives" target="_blank" rel="noreferrer">GITHUB ↗</a></footer>
    <script type="module" src="events.js?v=20261029-performers"></script>
  </body>
</html>
